name: deploy
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python code compiles
        run: python -m py_compile backend/api/handler.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::190335339393:role/localstay-github-deploy
          aws-region: ap-south-1
      - name: Deploy Lambda code
        run: |
          cd backend/api && zip -r ../../api.zip handler.py
          aws lambda update-function-code --function-name localstay-api --zip-file fileb://../../api.zip
      - name: Deploy frontend
        run: aws s3 cp frontend/index.html s3://localstay-site-190335339393/index.html --content-type text/html
