name: deploy
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest "moto[dynamodb]" boto3
      - run: python -m pytest backend/tests -v
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::190335339393:role/localstay-github-deploy
          aws-region: ap-south-1
      - name: Deploy Lambda code
        run: |
          cd backend/api && zip -r ../../api.zip handler.py
          aws lambda update-function-code --function-name localstay-api --zip-file fileb://../../api.zip
      - name: Deploy frontend
        run: aws s3 cp frontend/index.html s3://localstay-site-190335339393/index.html --content-type text/html
